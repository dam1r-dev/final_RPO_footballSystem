services:
  db:
    image: postgres:15-alpine
    container_name: football_db
    environment:
      POSTGRES_DB: football_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: damir
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./demo
    container_name: football_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=football_db
      - DB_USER=postgres
      - DB_PASSWORD=damir
    depends_on:
      db:
        condition: service_healthy